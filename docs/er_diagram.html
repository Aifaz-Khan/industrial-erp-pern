<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Industrial ERP - Entity Relationship (ER) Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 1300px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      color: #0f172a;
    }
    p {
      margin: 4px 0 0 0;
      color: #64748b;
      font-size: 13px;
    }
    .diagram-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 16px;
    }
    img, svg {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Industrial B2B Manufacturing &amp; Supply Chain ERP</h1>
      <p>Entity-Relationship Diagram &bull; PostgreSQL &bull; Prisma ORM</p>
    </div>
  </div>
  <div class="diagram-container">
    <img src="er_diagram.svg" alt="Entity Relationship Diagram" width="1300" height="900">
  </div>
</body>
</html>
